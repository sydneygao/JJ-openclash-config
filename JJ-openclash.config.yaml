# 机场订阅
# 替换自己的机场订阅地址 url: "https://"
# 订阅更新频率(秒)，不更新填写 interval: 0
proxy-providers:
  Airport1:
    url: "https://"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.mijia.com"
    - "+.mijia.cn"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: lru
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  
  # 启动时用于解析域名服务器IP的“救命DNS”，用最快的UDP即可
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国内 DNS 改用普通 UDP（丢掉 https:// 前缀，去掉加密开销，速度最快）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 指定 DNS 解析代理节点域名
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
 
# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点和icon图标，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  # SSID 策略组：特定 WiFi 下自动直连，其他情况使用自动选择
  - {name: 🚀 默认代理, type: select, proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, ♻️ 自动选择, 🌐 手动选择, DIRECT]}
  - {name: 📹 Google, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 🤖 Ai, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 🍎 Apple, type: select, proxies: [DIRECT, 🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 🐬 Social, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 💻 Microsoft, type: select, proxies: [DIRECT, 🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择]}
  - {name: 📲 Games, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 🎥 NETFLIX, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 🍀 Spotify, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  - {name: 💶 PayPal, type: select, proxies: [🇺🇸 美国节点, 🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🌐 手动选择, DIRECT]}
  - {name: 🔞 Shield, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT, REJECT]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🌐 手动选择, DIRECT]}
  # 区域自动选择组
  - {name: 🇭🇰 香港节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "HKG"}
  - {name: 🇯🇵 日本节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "JPN"}
  - {name: 🇸🇬 新加坡节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "SGP"}
  - {name: 🇺🇸 美国节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "USA"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(HKG|JPN|SGP|USA) 0[1-5]"}
  - {name: 🌐 手动选择, type: select, include-all: true}

