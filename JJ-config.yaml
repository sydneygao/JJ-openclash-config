# 在OpenWrt下的OpenClash配置文件
# 使用方法：使用前填写完整机场订阅地址

# 机场订阅
proxy-providers:
  Airport1:
    url: "https://" # 机场订阅替换自己的机场订阅地址 url: "https://"
    type: http
    interval: 86400 # 订阅更新频率(秒)，不更新填写 interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.mijia.com"
    - "+.mijia.cn"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: lru
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    # LAN / mDNS
    - '+.lan'
    - '+.local'

    # Xiaomi / Mi Home / IoT
    - '+.mi.com'
    - '+.xiaomi.com'
    - '+.xiaomi.net'
    - '+.miui.com'

    # STUN / P2P / NAT Traversal
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'

    # Apple
    - 'captive.apple.com'
    - '*.push.apple.com'

    # Google Lens / Voice
    - 'lens.l.google.com'

    # Nintendo Switch
    - '*.n.n.srv.nintendo.net'

    # PlayStation
    - '+.stun.playstation.net'

    # Xbox
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'

    # Microsoft Connectivity
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.msidentity.com'
  
  # 启动时用于解析域名服务器IP的“救命DNS”，用最快的UDP即可
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国内 DNS 改用普通 UDP（丢掉 https:// 前缀，去掉加密开销，速度最快）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 指定 DNS 解析代理节点域名
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
 
# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点和icon图标，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  # 应用端策略组
  - {name: 默认代理, type: fallback, proxies: [香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点], url: "https://www.gstatic.com/generate_204", interval: 600, timeout: 5000}
  - {name: Google, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Ai, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Apple, type: select, proxies: [DIRECT, 默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择]}
  - {name: GitHub, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Social, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Microsoft, type: select, proxies: [DIRECT, 默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择]}
  - {name: Games, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: NETFLIX, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Spotify, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: PayPal, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  - {name: Shield, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT, REJECT]}
  - {name: 漏网之鱼, type: select, proxies: [默认代理, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 手动选择, DIRECT]}
  # 区域策略组
  - {name: 香港节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(香港|港|HKG|HK|Hong[ _-]*Kong)"}
  - {name: 日本节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(日本|日|JPN|JP|Japan|Tokyo|东京|東京|Osaka|大阪)"}
  - {name: 新加坡节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(新加坡|狮城|獅城|SGP|SG|Singapore)"}
  - {name: 台湾节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(?:台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|TPE)"}
  - {name: 美国节点, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(美国|美國|USA|US|United[ _-]*States|America)"}
  - {name: 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 600, lazy: true, filter: "(?i)(香港|港|HKG|HK|Hong[ _-]*Kong|日本|日|JPN|JP|Japan|Tokyo|东京|東京|Osaka|大阪|新加坡|狮城|獅城|SGP|SG|Singapore|台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|TPE|美国|美國|USA|US|United[ _-]*States|America)"}
  - {name: 手动选择, type: select, include-all: true}

# 规则匹配
rules:
  # =========================================================
  # 1. 内网优先
  # =========================================================

  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  
  # =========================================================
  # 2. 自定义前置规则
  # =========================================================


  # =========================================================
  # 3. 海外服务 DOMAIN 分类
  # =========================================================

  # Ai前置，防风控；主规则集 + 四源验证后的高置信补充
  - RULE-SET,ai_domain,Ai
  - DOMAIN-SUFFIX,searchgpt.com,Ai
  - DOMAIN,cdn.openaimerge.com,Ai
  - DOMAIN-SUFFIX,gemini.googleusercontent.com,Ai
  - DOMAIN,copilotstudio.microsoft.com,Ai
  - DOMAIN-SUFFIX,muse.ai,Ai
  - DOMAIN-SUFFIX,skiv.com,Ai

  # Google，含YouTube
  - RULE-SET,google_domain,Google

  # GitHub
  - RULE-SET,github_domain,默认代理

  # Social
  - RULE-SET,whatsapp_domain,Social
  - RULE-SET,instagram_domain,Social
  - RULE-SET,facebook_domain,Social
  - RULE-SET,snapchat_domain,Social
  - RULE-SET,telegram_domain,Social
  - RULE-SET,twitter_domain,Social
  - RULE-SET,discord_domain,Social

  # Microsoft
  - RULE-SET,microsoft_domain,Microsoft
  - DOMAIN,m365.cloud.microsoft,Microsoft

  # Apple
  - RULE-SET,apple_domain,Apple

  # Spotify
  - RULE-SET,spotify_domain,Spotify

  # Shield
  - RULE-SET,porn_domain,Shield
  - DOMAIN-SUFFIX,91porn.com,Shield
  - DOMAIN-SUFFIX,njavtv.com,Shield

  # Netflix
  - RULE-SET,netflix_domain,NETFLIX

  # Games
  - RULE-SET,steam@cn_domain,DIRECT
  - RULE-SET,games_domain,Games

  # PayPal
  - RULE-SET,paypal_domain,PayPal
  
  # =========================================================
  # 4. 国内域名直连
  # =========================================================
  
  - RULE-SET,cn_domain,DIRECT

  # =========================================================
  # 5. IP 规则集
  # =========================================================

  - RULE-SET,telegram_ip,Social,no-resolve
  - RULE-SET,twitter_ip,Social,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve

  # =========================================================
  # 6. ASN 补充规则 —— 四源验证，仅保留服务/厂商专属性较高的 ASN
  # =========================================================

  # AI / Anthropic
  - IP-ASN,399358,Ai,no-resolve

  # Social / Meta / WhatsApp / Snapchat
  - IP-ASN,395291,Social,no-resolve    # Snapchat
  - IP-ASN,32934,Social,no-resolve     # Meta

  # GitHub
  - IP-ASN,36459,默认代理,no-resolve   # GitHub

  # PayPal
  - IP-ASN,1449,PayPal,no-resolve
  - IP-ASN,17012,PayPal,no-resolve

  # Games
  - IP-ASN,395856,Games,no-resolve   # 2K Games
  - IP-ASN,394977,Games,no-resolve   # Take-Two
  - IP-ASN,46555,Games,no-resolve    # Take-Two
  - IP-ASN,54107,Games,no-resolve    # Take-Two
  - IP-ASN,202021,Games,no-resolve   # Take-Two
  - IP-ASN,32590,Games,no-resolve    # Valve / Steam
  - IP-ASN,33353,Games,no-resolve    # PlayStation
  - IP-ASN,11278,Games,no-resolve    # Nintendo of America
  - IP-ASN,152877,Games,no-resolve   # Nintendo Japan
  - IP-ASN,22697,Games,no-resolve    # Roblox
  - IP-ASN,11281,Games,no-resolve    # Roblox Corporate


  # =========================================================
  # 7. 非中国大陆域名兜底
  # =========================================================

  - RULE-SET,geolocation-!cn,默认代理

  # =========================================================
  # 8. 中国大陆 IP 兜底
  # =========================================================

  - RULE-SET,cn_ip,DIRECT,no-resolve

  # =========================================================
  # 9. 最终兜底
  # =========================================================

  - MATCH,漏网之鱼

